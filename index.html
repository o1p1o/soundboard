<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Soundboard</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: white;
            color: #111;
        }

        .soundboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .sound {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .sound-button {
            width: 100%;
            aspect-ratio: 1 / 1;

            border: none;
            border-radius: 22px;

            background: #81768f;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .sound-emoji {
            font-size: 42px;
            line-height: 1;
        }

        .sound-name {
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
            color: #111;
        }
    </style>
</head>

<body>

    <main class="soundboard" id="soundboard"></main>

    <script>

        // ==========================================
        // ДОБАВЛЯЙ И РЕДАКТИРУЙ ЗВУКИ ЗДЕСЬ
        // ==========================================

        const sounds = [
            {
                file: "sounds/sound1.mp3",
                emoji: "🔊",
                name: "Sound 1"
            },
            {
                file: "sounds/sound2.mp3",
                emoji: "😂",
                name: "Sound 2"
            },
            {
                file: "sounds/sound3.mp3",
                emoji: "👏",
                name: "Sound 3"
            },
            {
                file: "sounds/sound4.mp3",
                emoji: "😱",
                name: "Sound 4"
            },
            {
                file: "sounds/sound5.mp3",
                emoji: "❤️",
                name: "Sound 5"
            },
            {
                file: "sounds/sound6.mp3",
                emoji: "💀",
                name: "Sound 6"
            },
            {
                file: "sounds/sound7.mp3",
                emoji: "🔥",
                name: "Sound 7"
            },
            {
                file: "sounds/sound8.mp3",
                emoji: "🎵",
                name: "Sound 8"
            },
            {
                file: "sounds/sound9.mp3",
                emoji: "🤣",
                name: "Sound 9"
            }
        ];


        // ==========================================
        // СОЗДАНИЕ КНОПОК
        // ==========================================

        const soundboard = document.getElementById("soundboard");

        sounds.forEach(sound => {

            const container = document.createElement("div");
            container.className = "sound";

            const button = document.createElement("button");
            button.className = "sound-button";

            const emoji = document.createElement("span");
            emoji.className = "sound-emoji";
            emoji.textContent = sound.emoji;

            const name = document.createElement("div");
            name.className = "sound-name";
            name.textContent = sound.name;

            button.appendChild(emoji);
            container.appendChild(button);
            container.appendChild(name);
            soundboard.appendChild(container);


            // Каждый клик создаёт новый экземпляр Audio.
            // Поэтому несколько нажатий могут звучать одновременно.

            button.addEventListener("click", () => {
                const audio = new Audio(sound.file);
                audio.play();
            });

        });

    </script>

</body>
</html>
